<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LK TV SERIES HUB</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080811;
  color:#fff;
}
header{
  text-align:center;
  padding:30px 15px;
  background:linear-gradient(135deg,#11112b,#241044,#071d2d);
  border-bottom:2px solid #00eaff;
}
header h1{
  color:#00eaff;
  font-size:clamp(25px,5vw,42px);
  margin:0;
  text-shadow:0 0 15px #00eaff;
}
header p{color:#ddd}
.container{max-width:1200px;margin:auto;padding:20px}
.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:22px;
}
input,select{
  padding:13px;
  border-radius:8px;
  border:1px solid #00eaff;
  background:#151525;
  color:white;
  flex:1;
  min-width:180px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(155px,1fr));
  gap:16px;
}
.card{
  background:#141423;
  border:1px solid #343451;
  border-radius:12px;
  padding:17px 12px;
  text-align:center;
  transition:.2s;
}
.card:hover{
  transform:translateY(-4px);
  border-color:#ff39d4;
  box-shadow:0 0 15px #ff39d455;
}
.card h3{color:#00eaff;margin-top:5px}
.price{color:#b7ff38;font-weight:bold}
.card a{
  display:block;
  text-decoration:none;
  color:#080811;
  background:linear-gradient(90deg,#00eaff,#b7ff38);
  padding:10px;
  border-radius:7px;
  font-weight:bold;
  margin-top:12px;
}
footer{
  text-align:center;
  padding:25px;
  color:#aaa;
  border-top:1px solid #29293e;
  margin-top:30px;
}
</style>
</head>
<body>

<header>
  <h1>LK TV SERIES HUB</h1>
  <p>🔥 ඔබගේ ප්‍රියතම TV Series එකම තැනකින් 🔥</p>
  <p>SINHALA SUBTITLES | PREMIUM COLLECTION</p>
</header>

<div class="container">
  <div class="controls">
    <input type="search" id="search" placeholder="🔍 Series එකක් සොයන්න...">
    <select id="genre">
      <option value="all">සියලුම Series</option>
      <option value="Action">Action</option>
      <option value="Crime">Crime</option>
      <option value="Drama">Drama</option>
      <option value="Fantasy">Fantasy</option>
      <option value="Horror">Horror</option>
      <option value="Sci-Fi">Sci-Fi</option>
      <option value="Thriller">Thriller</option>
    </select>
  </div>

  <div class="grid" id="seriesGrid"></div>
</div>

<footer>
  <h3>LK TV SERIES HUB</h3>
  <p>ඔබගේ ප්‍රියතම Series එක තෝරාගෙන වැඩි විස්තර බලන්න.</p>
</footer>

<script>
const series = [
  {name:"Breaking Bad",price:400,genre:"Crime",file:"breaking-bad"},
  {name:"Sex Education",price:300,genre:"Drama",file:"sex-education"},
  {name:"Vikings: Valhalla",price:200,genre:"Action",file:"vikings-valhalla"},
  {name:"Game of Thrones",price:500,genre:"Fantasy",file:"game-of-thrones"},
  {name:"Prison Break",price:450,genre:"Action",file:"prison-break"},
  {name:"Peaky Blinders",price:350,genre:"Crime",file:"peaky-blinders"},
  {name:"The Walking Dead",price:600,genre:"Horror",file:"the-walking-dead"},
  {name:"Money Heist",price:450,genre:"Crime",file:"money-heist"},
  {name:"Teen Wolf",price:400,genre:"Fantasy",file:"teen-wolf"},
  {name:"Stranger Things",price:400,genre:"Sci-Fi",file:"stranger-things"},
  {name:"Reacher",price:300,genre:"Action",file:"reacher"},
  {name:"True Blood",price:450,genre:"Fantasy",file:"true-blood"},
  {name:"The Flash",price:500,genre:"Action",file:"the-flash"},
  {name:"IT: Welcome to Derry",price:100,genre:"Horror",file:"it-welcome-to-derry"},
  {name:"House of the Dragon",price:250,genre:"Fantasy",file:"house-of-the-dragon"},
  {name:"One Piece",price:200,genre:"Action",file:"one-piece"},
  {name:"Robinhood (2026)",price:100,genre:"Drama",file:"robinhood-2026"},
  {name:"Lost",price:600,genre:"Sci-Fi",file:"lost"},
  {name:"Outer Banks",price:450,genre:"Drama",file:"outer-banks"},
  {name:"Kingdom",price:250,genre:"Horror",file:"kingdom"},
  {name:"From",price:300,genre:"Horror",file:"from"},
  {name:"Dark",price:300,genre:"Sci-Fi",file:"dark"},
  {name:"Duty After School",price:150,genre:"Sci-Fi",file:"duty-after-school"},
  {name:"Cobra Kai",price:350,genre:"Action",file:"cobra-kai"},
  {name:"The 100",price:500,genre:"Sci-Fi",file:"the-100"},
  {name:"Lucifer",price:500,genre:"Fantasy",file:"lucifer"},
  {name:"All of Us Are Dead",price:150,genre:"Horror",file:"all-of-us-are-dead"},
  {name:"Squid Game",price:300,genre:"Thriller",file:"squid-game"},
  {name:"Chernobyl",price:150,genre:"Drama",file:"chernobyl"},
  {name:"Sherlock",price:150,genre:"Crime",file:"sherlock"},
  {name:"Better Call Saul",price:450,genre:"Crime",file:"better-call-saul"},
  {name:"The Boys",price:300,genre:"Action",file:"the-boys"},
  {name:"Band of Brothers",price:150,genre:"Drama",file:"band-of-brothers"},
  {name:"The Last of Us",price:200,genre:"Horror",file:"the-last-of-us"},
  {name:"Dexter",price:550,genre:"Crime",file:"dexter"},
  {name:"Narcos",price:300,genre:"Crime",file:"narcos"}
];

const grid=document.getElementById("seriesGrid");
const search=document.getElementById("search");
const genre=document.getElementById("genre");

function render(){
  const q=search.value.toLowerCase();
  const g=genre.value;
  grid.innerHTML="";

  const filtered=series.filter(s=>
    s.name.toLowerCase().includes(q) &&
    (g==="all" || s.genre===g)
  );

  if(!filtered.length){
    grid.innerHTML="<p>Series එකක් හමු වුණේ නැහැ.</p>";
    return;
  }

  filtered.forEach(s=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <h3>${s.name}</h3>
      <p>සිංහල උපසිරැසි සහිතයි</p>
      <p class="price">රු. ${s.price}/=</p>
      <a href="series/${s.file}.html">විස්තර බලන්න</a>
    `;
    grid.appendChild(card);
  });
}

search.addEventListener("input",render);
genre.addEventListener("change",render);
render();
</script>
</body>
</html>
